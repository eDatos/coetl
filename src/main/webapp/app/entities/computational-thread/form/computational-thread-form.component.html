<ac-side-menu [parent]="instance"></ac-side-menu>
<form name="editForm" role="form" novalidate (ngSubmit)="save()" #editForm="ngForm">
    <div class="entity" #titlesContainer>
        <div>
            <h2>
                <div>
                    <button
                        *ngIf="!isEditMode()"
                        [routerLink]="['../../computational-threads']"
                        type="button"
                        class="btn btn-secondary btn-frameless back-arrow"
                        [attr.aria-label]="'entity.action.back' | translate"
                    >
                        <span class="fa fa-arrow-left"></span>
                    </button>
                    <span class="fa fa-file-code-o"></span>&nbsp;
                    <span *ngIf="!computationalThreads.id" jhiTranslate="computationalThread.threads.home.createLabel"></span>
                    <span *ngIf="computationalThreads.id">{{computationalThreads.name}}</span>
                </div>
                <div *ngIf="canEdit()">
                    <ng-container *ngIf="isEditMode()">
                        <button type="button" class="btn btn-default" data-dismiss="modal" (click)="cancel()">
                            <span class="fa fa-ban"></span>&nbsp;
                            <span jhiTranslate="entity.action.cancel"></span>
                        </button>
                        <button type="submit" [disabled]="editForm.form.invalid || !canSave()" class="btn btn-primary">
                            <span class="fa fa-save"></span>&nbsp;
                            <span jhiTranslate="entity.action.save"></span>
                        </button>
                    </ng-container>
                    <ng-container *ngIf="computationalThreads.id && !isEditMode()">
                        <ng-container *ngIf="!computationalThreads.isDeleted()">
                            <button class="btn btn-primary" type="button" (click)="execute()">
                                <span class="fa fa-play"></span>&nbsp;
                                <span jhiTranslate="entity.action.execute"></span>
                            </button>
                            <button class="btn btn-secondary jh-create-entity" (click)="edit()" type="button">
                                <span class="fa fa-pencil"></span>&nbsp;
                                <span jhiTranslate="entity.action.edit"></span>
                            </button>
                            <button type="button" (click)="delete()" replaceUrl="true" class="btn btn-danger">
                                <span class="fa fa-remove"></span>&nbsp;
                                <span class="hidden-md-down" jhiTranslate="entity.action.delete"></span>
                            </button>
                        </ng-container>
                        <ng-container *ngIf="computationalThreads.isDeleted()">
                            <button type="button" (click)="restore()" replaceUrl="true" class="btn btn-warning">
                                <span class="fa fa-repeat"></span>&nbsp;
                                <span class="hidden-md-down" jhiTranslate="entity.action.restore"></span>
                            </button>
                        </ng-container>
                    </ng-container>
                </div>
            </h2>
        </div>

        <fieldset [disabled]="!isEditMode()">
            <h3 jhiTranslate="computationalThread.threads.sections.identification"></h3>
            <div class="entity-fields">
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="computationalThread.threads.code.label" for="field_code"></label>
                    <input
                        type="text"
                        class="form-control"
                        name="code"
                        id="field_code"
                        [(ngModel)]="computationalThreads.code"
                        required
                        acAutofocus
                        [placeholder]="'computationalThread.threads.code.placeholder' | translate"
                        [disabled]="computationalThreads.id"
                    />
                    <div [hidden]="!(editForm.controls.code?.dirty && editForm.controls.code?.invalid)">
                        <small class="form-text text-danger" [hidden]="!editForm.controls.code?.errors?.required" jhiTranslate="entity.validation.required"> </small>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-control-label" jhiTranslate="computationalThread.threads.name.label" for="field_name"></label>
                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        id="field_name"
                        [(ngModel)]="computationalThreads.name"
                        required
                        [placeholder]="'computationalThread.threads.name.placeholder' | translate"
                    />
                    <div [hidden]="!(editForm.controls.name?.dirty && editForm.controls.name?.invalid)">
                        <small class="form-text text-danger" [hidden]="!editForm.controls.name?.errors?.required" jhiTranslate="entity.validation.required"> </small>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label class="form-control-label" jhiTranslate="computationalThread.threads.description.label" for="field_description"></label>
                    <textarea
                        [disabled]="!isEditMode()"
                        class="form-control"
                        name="description"
                        id="field_description"
                        [(ngModel)]="computationalThreads.description"
                        maxlength="4000"
                        autosize
                        [placeholder]="'computationalThread.threads.description.placeholder' | translate"
                        #descriptionContainer
                    ></textarea>
                </div>
                <div class="form-group">
                    <label class="form-control-label" for="field_externalitem">
                        <span jhiTranslate="computationalThread.threads.statisticalOperation.label"></span>
                        <span>
                            <ac-help-tooltip [position]="'bottom'" [label]="'coetlApp.externalItem.statisticalOperation.help' | translate"></ac-help-tooltip>
                        </span>
                    </label>

                    <ac-autocomplete-long-list
                        name="externalItem"
                        [multiple]="false"
                        [(ngModel)]="computationalThreads.externalItem"
                        [suggestions]="externalItemsSuggestions"
                        (completeMethod)="completeMethodStatisticalOperations($event)"
                        [emptyMessage]="'coetlApp.externalItem.statisticalOperation.filters.emptyExternalItem' | translate"
                        [properties]="['code','name']"
                        [required]="true"
                    ></ac-autocomplete-long-list>
                </div>
            </div>
        </fieldset>

        <fieldset *ngIf="computationalThreads.id">
            <ac-computational-thread-etl-list
                [idThread]="computationalThreads.id"
                [etlsThread]="computationalThreads.computationalThreadsEtl"
                [(selectedEtls)]="selectedEtls"
                [etlList]="etlList"
                [isEdit]="isEditMode()"
            ></ac-computational-thread-etl-list>
        </fieldset>

        <fieldset [disabled]="!isEditMode()">
            <h3 jhiTranslate="computationalThread.threads.sections.planning"></h3>
            <div class="entity-fields">
                <div class="form-group">
                    <label class="form-control-label" for="field_executionPlanning">
                        <span jhiTranslate="computationalThread.threads.executionPlanning.label"></span>
                        <span (click)="help()">
                            <ac-help-tooltip [position]="'bottom'" [label]="'coetlApp.etlExpressionHelp.tooltip' | translate"></ac-help-tooltip>
                        </span>
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        name="executionPlanning"
                        id="field_executionPlanning"
                        [(ngModel)]="computationalThreads.executionPlanning"
                        [placeholder]="'computationalThread.threads.executionPlanning.placeholder' | translate"
                    />
                </div>
                <dl *ngIf="canShowNextExecution()" class="jh-entity-details">
                    <dt>
                        <label jhiTranslate="computationalThread.threads.nextExecution.label"></label>
                    </dt>
                    <dd>{{ computationalThreads.nextExecution | acDate: 'datetime' }}</dd>
                </dl>
                <div class="form-group full-width">
                    <label class="form-control-label" jhiTranslate="computationalThread.threads.executionDescription.label" for="field_executionDescription"></label>
                    <textarea
                        [disabled]="!isEditMode()"
                        class="form-control"
                        name="executionDescription"
                        id="field_executionDescription"
                        [(ngModel)]="computationalThreads.executionDescription"
                        maxlength="4000"
                        [placeholder]="'computationalThread.threads.executionDescription.placeholder' | translate"
                        autosize
                        #executionDescriptionContainer
                    ></textarea>
                </div>
            </div>
        </fieldset>

        <fieldset *ngIf="computationalThreads.id">
            <ac-computational-threads-execution-list [idThread]="computationalThreads.id"></ac-computational-threads-execution-list>
        </fieldset>
        <ac-audit-info [entity]="computationalThreads"></ac-audit-info>
    </div>
</form>
