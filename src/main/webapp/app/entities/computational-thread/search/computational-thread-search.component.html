<div class="entity-search">
    <div class="entity-search-field">
        <label for="titulo" jhiTranslate="computationalThread.filters.code.label"></label>
        <input
            class="form-control"
            [attr.aria-label]="'computationalThread.filters.code.placeholder' | translate"
            placeholder="{{'computationalThread.filters.code.placeholder' | translate}}"
            [(ngModel)]="filters.code"
            (keyup)="filter()"
        />
    </div>

    <div class="entity-search-field">
        <label for="name" jhiTranslate="computationalThread.filters.name.label"></label>
        <input
            class="form-control"
            [attr.aria-label]="'computationalThread.filters.name.placeholder' | translate"
            placeholder="{{'computationalThread.filters.name.placeholder' | translate}}"
            [(ngModel)]="filters.name"
            (keyup)="filter()"
        />
    </div>

    <div class="entity-search-field-btn">
        <button class="btn btn-default" (click)="resetFilters();">
            <i class="fa fa-times"></i>
            <span jhiTranslate="entity.action.filtersReset"></span>
        </button>
    </div>
</div>
